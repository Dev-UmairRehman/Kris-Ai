<!-- ==========================================================================
     StrategyTraining - Kris AI Memory embed

     WHERE THIS GOES  (step 2 of 2)
     Marketing > Website > Landing Pages > + New page > name it "Kris AI Memory"
     > add a Custom HTML block > paste this whole file into it > Publish.

     STEP 1 IS NOT OPTIONAL. Paste uscreen/head-code.html into
     Settings > Website > Head Code FIRST. A Uscreen landing page is public, so
     that snippet is what tells the widget whether the visitor is signed in.
     Without it nobody can use the widget - not even a paying member.

     Uscreen's editor canvas does not render Custom HTML - use "Preview page",
     and open the preview in a normal (not incognito) tab so you are signed in.

     The deployed origin is already filled in below. Nothing to replace.
     ========================================================================== -->

<style>
  .kris-ai-embed {
    /* Fill the space Uscreen gives us without ever causing a double scrollbar.
       The widget manages its own internal scrolling. */
    position: relative;
    width: 100%;
    /* Leaves room for the ST header; the widget is a fixed shell inside. */
    height: min(82vh, 940px);
    min-height: 520px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
  }
  .kris-ai-embed iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  /* On short screens give it the whole viewport minus the header. */
  @media (max-height: 700px) {
    .kris-ai-embed {
      height: calc(100vh - 120px);
    }
  }
  @media (max-width: 640px) {
    .kris-ai-embed {
      border-radius: 0;
      height: calc(100dvh - 130px);
    }
  }
</style>

<div class="kris-ai-embed">
  <iframe
    src="https://kris-ai-memory-baefm.ondigitalocean.app/embed"
    title="Kris AI Memory"
    loading="eager"
    allow="microphone https://kris-ai-memory-baefm.ondigitalocean.app"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>

<script>
(function () {
  'use strict';

  /* Must match the iframe src origin and head-code.html. */
  var WIDGET_ORIGIN = 'https://kris-ai-memory-baefm.ondigitalocean.app';

  /* The widget tells us when it has gated a visitor, so the page can explain
     itself rather than showing a silent box. The page itself is public - login state is what
     the gate checks, so this is a belt-and-braces path. */
  window.addEventListener('message', function (event) {
    if (event.origin !== WIDGET_ORIGIN) return;
    var data = event.data;
    if (!data || data.type !== 'kris-ai:gated') return;
    console.log('[st-kris] widget gated this visitor:', data.reason);
  });
})();
</script>
