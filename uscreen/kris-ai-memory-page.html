<!-- ==========================================================================
     StrategyTraining - Kris AI Memory page

     WHERE THIS GOES
     Marketing > Website > Landing Pages > your "Kris AI Memory" page >
     add a Custom HTML block > paste this whole file into it > Publish.

     VERSION 6.  HOW TO TELL WHAT IS ACTUALLY LIVE
     On the published page, open the console. The first [st-kris] line names the
     version, e.g.  [st-kris] page snippet v6.  If it says anything else, or
     nothing, the paste did not take and the fixes in this file are not running -
     re-paste the WHOLE file over the Custom HTML block and publish again.

     THIS FILE IS SELF-CONTAINED. It carries the widget AND the identity bridge
     that lets a signed-in member in. One paste, nothing else to do.

     WHY THE BRIDGE IS IN HERE AND NOT IN THE HEAD CODE
     Uscreen does NOT inject the site-wide Head Code into landing pages. Verified
     on this store: the homepage and /join both carry it, /pages/kris-ai-memory
     carries none of it - not even the gift-card block that has been live since
     February. Landing pages render through a different path. So a bridge in the
     Head Code would never run on the one page that needs it, and every member
     would see "Please sign in" while logged in. It lives here instead.

     Uscreen's editor canvas does not render Custom HTML - use "Preview page",
     in a normal (not incognito) tab so you are signed in.

     The deployed origin is already filled in below. Nothing to replace.
     ========================================================================== -->

<style>
  .kris-ai-embed {
    /* Fill the space Uscreen gives us without ever causing a double scrollbar.
       The widget manages its own internal scrolling. */
    position: relative;
    width: 100%;
    /* Set by the script below, which measures the room actually left. A fixed
       height here is what caused the second scrollbar. */
    height: 70vh;
    /* Must match MIN_HEIGHT in the script below. A larger value here silently
       overrides the measured height and the page starts scrolling again. */
    min-height: 320px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
  }
  .kris-ai-embed iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  @media (max-width: 640px) {
    .kris-ai-embed {
      border-radius: 0;
    }
  }
</style>

<!-- --------------------------------------------------------------------------
     Height. The widget scrolls its own messages, and that internal scroll is
     the one to keep. The problem was the OUTER one: a fixed 82vh made the page
     taller than the window once the store's header, footer and section padding
     were added, so the page scrolled too.

     The fix measures instead of guessing. It sizes the widget to the space left
     below it, then subtracts whatever the page still overflows by and repeats -
     which absorbs the footer, the section's padding and the admin bar without
     needing to know any of their heights. calc() cannot do this.
     ------------------------------------------------------------------------ -->
<div class="kris-ai-embed">
  <iframe
    src="https://kris-ai-memory-baefm.ondigitalocean.app/embed"
    title="Kris AI Memory"
    loading="eager"
    allow="microphone https://kris-ai-memory-baefm.ondigitalocean.app"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>

<script>
(function () {
  'use strict';

  /* Bumped whenever this file changes, and logged on load. Three rounds were
     spent debugging behaviour that was simply not on the page yet, so the page
     now says which version it is running. */
  var SNIPPET_VERSION = 6;
  console.log('[st-kris] page snippet v' + SNIPPET_VERSION);

  /* Low enough to still fit on a 1366x768 screen once the store's nav, the
     admin bar and the footer have taken their share. The widget scrolls its own
     messages, so a short one is usable; a taller floor would force the page to
     scroll, which is the thing being fixed. */
  var MIN_HEIGHT = 320;

  /* Re-entrancy guard: fit() changes the page height, which is exactly what the
     ResizeObserver watches. */
  var fitting = false;

  function fit() {
    if (fitting) return;
    var box = document.querySelector('.kris-ai-embed');
    if (!box) return;

    fitting = true;
    try {
      /* Where the widget starts, measured from the top of the document so the
         answer is the same whether or not the page happens to be scrolled. */
      var top = box.getBoundingClientRect().top + (window.pageYOffset || 0);
      var height = window.innerHeight - top;

      /* Then take off however much the page still overflows, and repeat. This
         absorbs everything below the widget - the footer, the section's own
         padding, the admin bar - without having to know what any of it is or
         how tall it happens to be today. It converges in one or two passes;
         the third is a guard. */
      /* Visible again if a navigation had hidden it - see below. */
      box.style.visibility = '';

      for (var pass = 0; pass < 4; pass++) {
        var applied = Math.max(MIN_HEIGHT, Math.round(height));
        box.style.height = applied + 'px';

        var root = document.documentElement;
        var over = root.scrollHeight - root.clientHeight;
        if (over <= 1) break;

        /* Already as small as it is allowed to be - on a very short window
           something has to give, and it is better that it is the page than an
           unusable widget. */
        if (applied <= MIN_HEIGHT) break;

        height = applied - over;
      }
    } finally {
      fitting = false;
    }
  }

  /* Uscreen swaps pages with Turbo, without a reload. A cross-origin iframe can
     keep painting for a frame or two after its container has gone, which looks
     like the widget floating over the top of the next page. Hiding it the moment
     a navigation begins costs nothing and removes that; fit() clears the flag if
     we come back. */
  function hideWhileLeaving() {
    var box = document.querySelector('.kris-ai-embed');
    if (box) box.style.visibility = 'hidden';
  }
  /* Earliest possible signal, and it does not depend on Turbo firing anything:
     the member has clicked something that leaves this page. Capture phase, so
     it runs before any handler that might stop propagation. */
  document.addEventListener(
    'click',
    function (event) {
      var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
      if (!link) return;
      try {
        var to = new URL(link.getAttribute('href'), location.href);
        if (to.pathname !== location.pathname || to.origin !== location.origin) {
          hideWhileLeaving();
        }
      } catch (e) {
        /* not a URL we can read - leave it alone */
      }
    },
    true
  );

  document.addEventListener('turbo:before-visit', hideWhileLeaving);
  document.addEventListener('turbo:visit', hideWhileLeaving);
  document.addEventListener('turbo:before-render', hideWhileLeaving);
  window.addEventListener('pagehide', hideWhileLeaving);

  fit();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fit);
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  /* Uscreen is a Hotwire app - a soft navigation back to this page re-runs it. */
  document.addEventListener('turbo:load', fit);

  /* Fonts and images landing late change the header's height. */
  if (window.ResizeObserver) {
    try {
      new ResizeObserver(fit).observe(document.body);
    } catch (e) {
      /* not fatal - the resize listener still covers the common case */
    }
  }
})();
</script>

<!-- --------------------------------------------------------------------------
     Identity bridge.  DO NOT DELETE - without it nobody can use the widget.

     Kris AI Memory (BuddyPro) runs on its own domain inside the iframe above, so
     it cannot read the Uscreen session cookie. This tells it whether anyone is
     signed in. The widget forwards that to its own server, which will not open a
     session without it.

     HOW IT KNOWS
     It asks Uscreen: GET /account, same-origin, so the session cookie rides
     along. Measured on this store:

       signed out, no Accept header    ->  401   (the auth layer answers first)
       signed out, Accept: text/html   ->  302   to the sign-in page
       signed in,  no Accept header    ->  200   the account page
       signed in,  Accept: json        ->  406   the route only renders HTML

     So it sends NO Accept header. Asking for JSON was an earlier mistake: it
     returns 401 signed out, which looks right, but 406 signed in - which read
     as "cannot tell" and showed members the sign-in screen. 406 is now also
     treated as signed in, since reaching it means the auth check passed.

     What it deliberately does NOT do is read the DOM for a sign-in link. That
     was the first attempt and it was wrong: this store keeps an
     <a href="/sign_in"> inside a menu even when someone is signed in, so
     "no sign-in link means signed in" reported every member as a visitor. The
     header's visible Sign in control is a <ds-button>, not an <a>, which is why
     the two disagreed. /account is the store's own answer and cannot drift.

     This page is a landing page, so it is PUBLIC. Being framed by
     strategytraining.com therefore proves nothing, and the signed-in answer
     below is what carries the gate. No answer, no session - it fails closed.

     HOW STRONG IS THIS
     Strong enough to stop every ordinary visitor. Not cryptographic: the claim
     is made in the browser, so someone already on strategytraining.com with the
     dev console open could assert it by hand. The widget's CSP frame-ancestors
     rule stops it loading anywhere but strategytraining.com, and per-session and
     global rate limits cap what any one of them could spend. For real
     verification set MEMBER_GATE_MODE=strict on the app and supply the Uscreen
     Publisher API key (UscreenPlus or Custom plan).

     PROTOCOL
       widget -> page :  { type: 'kris-ai:ready' }
       page -> widget :  { type: 'st-kris:identity', signedIn, email, uscreenId }
       widget -> page :  { type: 'kris-ai:gated', reason }   (logged only)

     signedIn grants access. email/uscreenId only decide which memory thread the
     member gets, and are blank when signedIn is false.

     Both sides post to an explicit origin, never '*'.

     WHAT TO LOOK FOR IF IT MISBEHAVES
     Open the console on this page. One [st-kris] line reports the whole story,
     e.g.  [st-kris] signedIn=true email=you@example.com via /account 200.
     Send that line to your developer.
     ------------------------------------------------------------------------ -->
<script>
(function () {
  'use strict';

  /* Must match the iframe src origin above. */
  var WIDGET_ORIGIN = 'https://kris-ai-memory-baefm.ondigitalocean.app';

  var EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;

  var cached = null;   /* only ever a definite answer from Uscreen */
  var pending = null;

  /* ---- ask Uscreen who this is ----------------------------------------- */

  /* The account page carries the member's email. Prefer the form field that
     holds it over a bare match, so a support address in the footer cannot win. */
  function emailFrom(text) {
    var field = text.match(/<input[^>]*(?:name|id)="[^"]*email[^"]*"[^>]*>/i);
    if (field) {
      var value = field[0].match(/value="([^"]*)"/i);
      if (value && EMAIL_RE.test(value[1])) return value[1];
    }
    var loose = text.match(EMAIL_RE);
    return loose ? loose[0] : '';
  }

  /* Where the redirect chain ended up, so a bounce to the sign-in page reads as
     signed out even when it answers 200. */
  function landedOn(res) {
    try {
      return new URL(res.url, location.href).pathname;
    } catch (e) {
      return '';
    }
  }

  function probeAccount() {
    /* No Accept header on purpose - see HOW IT KNOWS above. */
    return fetch('/account', { credentials: 'same-origin' })
      .then(function (res) {
        var path = landedOn(res);
        if (/\/(sign_in|login|join)\b/.test(path)) {
          return { signedIn: false, via: '/account -> ' + path };
        }
        if (res.status === 401 || res.status === 403) {
          return { signedIn: false, via: '/account ' + res.status };
        }
        /* 406 means the auth check PASSED and only the format was refused, so
           whoever this is, they are signed in. */
        if (res.status === 406) {
          return { signedIn: true, email: '', uscreenId: '', via: '/account 406' };
        }
        if (!res.ok) return null;   /* no opinion - caller fails closed */

        return res.text().then(function (text) {
          return {
            signedIn: true,
            email: emailFrom(text),
            uscreenId: '',
            via: '/account 200',
          };
        });
      })
      .catch(function () {
        return null;   /* offline, blocked, CSP - no opinion */
      });
  }

  /* The profile menu prints the member's email. Used only to name the memory
     thread, and only when /account did not include one. A logged-out page on
     this store contains no email anywhere (verified), so a hit is meaningful. */
  function emailFromDom() {
    var text = document.body ? document.body.innerText || '' : '';
    var m = text.match(EMAIL_RE);
    return m ? m[0] : '';
  }

  function resolveMember() {
    if (cached) return Promise.resolve(cached);
    if (pending) return pending;

    pending = probeAccount().then(function (result) {
      pending = null;

      if (!result) {
        /* Uscreen did not answer. Fail closed, and do NOT cache it - a network
           blip must not lock a member out for the rest of the visit. */
        console.warn(
          '[st-kris] could not reach /account, so treating this visitor as ' +
            'signed out. Send this line to your developer.'
        );
        return { signedIn: false, via: 'probe failed', transient: true };
      }

      if (result.signedIn && !result.email) {
        var domEmail = emailFromDom();
        if (domEmail) {
          result.email = domEmail;
          result.via += ' + email from the profile menu';
        }
      }

      cached = result;
      console.log(
        '[st-kris] signedIn=' +
          result.signedIn +
          ' email=' +
          (result.email || '(none)') +
          ' via ' +
          result.via
      );
      if (result.signedIn && !result.email) {
        console.log(
          '[st-kris] no email found, so memory is per-browser rather than ' +
            'per-member. Access is unaffected.'
        );
      }
      return result;
    });

    return pending;
  }

  /* ---- answer the widget ------------------------------------------------ */

  function answer(frame, member) {
    try {
      frame.postMessage(
        {
          type: 'st-kris:identity',
          /* The widget will not open without this. */
          signedIn: member.signedIn === true,
          email: (member.signedIn && member.email) || '',
          uscreenId: (member.signedIn && member.uscreenId) || '',
        },
        WIDGET_ORIGIN
      );
    } catch (e) {
      /* frame went away */
    }
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== WIDGET_ORIGIN) return;

    var data = event.data;
    if (!data) return;

    /* The widget reports when it turns someone away, so this page can say why
       in the console instead of just showing a box. */
    if (data.type === 'kris-ai:gated') {
      console.log('[st-kris] widget gated this visitor: ' + data.reason);
      return;
    }

    if (data.type !== 'kris-ai:ready') return;

    var frame = event.source;

    resolveMember().then(function (member) {
      answer(frame, member);

      /* If Uscreen simply did not answer in time, try once more and send a
         better answer. The widget listens for a late identity and retries its
         session, so a member is not left looking at the sign-in screen. */
      if (member.transient) {
        setTimeout(function () {
          resolveMember().then(function (second) {
            if (second.signedIn) answer(frame, second);
          });
        }, 1500);
      }
    });
  });

  /* Warm the lookup so the answer is ready the moment the widget asks - the
     iframe above takes longer to boot than this request takes to return. */
  resolveMember();
})();
</script>
