<!-- ==========================================================================
     StrategyTraining - Kris AI Memory page

     WHERE THIS GOES
     Marketing > Website > Landing Pages > "Kris AI Memory" > Custom HTML block.
     Paste all of it, publish. Nothing to edit.

     NOT in Settings > Snippets > Head Code. That box keeps head-code.html and
     nothing else.

     WHY IT LOADS THE SCRIPT THIS WAY
     A tag with a src attribute would be simpler, but pasting one into this block
     did not save at all - not even the div beside it - which points at the
     editor rejecting the whole block over the external tag. An inline script
     demonstrably does save here, so the loader is written inline and builds the
     tag itself. Same result, using only what this box is known to accept.

     Everything else - styles, iframe, height fit, identity bridge - lives in
     embed.js and ships with the app, so this block never needs touching again.

     CHECKING WHAT IS LIVE
     Open the console on the published page. It prints:
       [st-kris] embed v8 from https://kris-ai-memory-baefm.ondigitalocean.app
     No line means this block did not save.
     ========================================================================== -->

<div id="kris-ai-memory"></div>
<script>
(function () {
  var s = document.createElement('script');
  s.src = 'https://kris-ai-memory-baefm.ondigitalocean.app/static/embed.js';
  s.async = false;
  (document.head || document.documentElement).appendChild(s);
})();
</script>
