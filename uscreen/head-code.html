<!-- ==========================================================================
     StrategyTraining - Kris AI Memory identity bridge
     WHERE THIS GOES
     Settings > Snippets > Head Code
     (or Website > Advanced > Customizations > Head Code)

     APPEND it to whatever is already in that box. Do NOT replace the contents -
     the gift card and sub-nav snippets already there must stay.

     The deployed origin is already filled in below. Nothing to replace.

     WHAT THIS DOES
     The Kris AI widget runs on its own domain inside an iframe, so it cannot
     read the Uscreen session cookie. This snippet tells the widget which
     member is signed in. The widget forwards that claim to its own server,
     which verifies it against the Uscreen API before trusting it - so a forged
     value here does not grant access.

     PROTOCOL
       widget -> parent :  { type: 'kris-ai:ready' }
       parent -> widget :  { type: 'st-kris:identity', email, uscreenId }

     Both sides post to an explicit origin, never '*'.

     THIS SNIPPET IS NOT OPTIONAL
     The widget refuses to open until this tells it someone is signed in. Without
     it, every visitor sees the "please sign in" screen - which is the safe way
     round, because a Uscreen landing page is public.

     IF THE EMAIL CANNOT BE FOUND
     Access still works (login state is enough); only per-member memory is
     affected, since members would share a per-browser thread instead.
     Open the browser console on /delphi and look for the [st-kris] line: it
     names the source that worked, or reports that none did. Send me that line
     and I will pin the lookup to the one that works on your store.
     ========================================================================== -->
<script>
(function () {
  'use strict';

  /* The origin the widget is served from. */
  var WIDGET_ORIGIN = 'https://kris-ai-memory-baefm.ondigitalocean.app';

  var cached = null;

  /* Is anyone signed in? Uscreen renders a link to /sign_in in the header ONLY
     for logged-out visitors, which is the same signal the public Kris AI
     gateway page already uses on this store. Absence of that link means signed
     in.

     This matters because a Uscreen landing page is PUBLIC. The widget refuses
     to open unless this says someone is signed in, so putting it on a public
     page does not hand it to the world. */
  function isSignedIn() {
    var signInLink = document.querySelector(
      'a[href="/sign_in"], a[href$="/sign_in"], a[href*="/sign_in?"]'
    );
    if (signInLink) return false;

    /* Corroboration, where the storefront offers it. */
    var signedOutHints = document.querySelector('a[href="/login"], a[href$="/login"]');
    if (signedOutHints) return false;

    return true;
  }

  /* ---- find the signed-in member ---------------------------------------- */

  /* Synchronous sources first - these cost nothing. */
  function fromGlobals() {
    var roots = [window.Uscreen, window.uscreen, window.USCREEN, window.currentUser];
    for (var i = 0; i < roots.length; i++) {
      var root = roots[i];
      if (!root || typeof root !== 'object') continue;
      var user = root.user || root.currentUser || root.customer || root;
      if (user && typeof user.email === 'string' && user.email.indexOf('@') > 0) {
        return { email: user.email, uscreenId: user.id || '', via: 'window global' };
      }
    }
    return null;
  }

  function fromMeta() {
    var names = [
      'current-user-email',
      'current_user_email',
      'user-email',
      'customer-email',
    ];
    for (var i = 0; i < names.length; i++) {
      var tag = document.querySelector('meta[name="' + names[i] + '"]');
      var value = tag && tag.getAttribute('content');
      if (value && value.indexOf('@') > 0) {
        return { email: value, uscreenId: '', via: 'meta[' + names[i] + ']' };
      }
    }
    return null;
  }

  function fromDataAttributes() {
    var nodes = document.querySelectorAll('[data-user-email], [data-customer-email], [data-email]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var value =
        el.getAttribute('data-user-email') ||
        el.getAttribute('data-customer-email') ||
        el.getAttribute('data-email');
      if (value && value.indexOf('@') > 0) {
        return {
          email: value,
          uscreenId: el.getAttribute('data-user-id') || '',
          via: 'data attribute',
        };
      }
    }
    return null;
  }

  /* Then same-origin authenticated endpoints. These carry the Uscreen session
     cookie automatically, so they only ever return the current member. */
  var ENDPOINTS = [
    '/api/v1/users/me',
    '/api/v1/customers/me',
    '/api/v1/me',
    '/users/me.json',
    '/account.json',
    '/api/customer',
  ];

  function pluckEmail(payload) {
    if (!payload || typeof payload !== 'object') return null;
    var candidates = [payload, payload.user, payload.customer, payload.data, payload.me];
    for (var i = 0; i < candidates.length; i++) {
      var c = candidates[i];
      if (c && typeof c.email === 'string' && c.email.indexOf('@') > 0) {
        return { email: c.email, uscreenId: c.id || c.uuid || '' };
      }
    }
    return null;
  }

  function fromEndpoints() {
    var chain = Promise.resolve(null);

    ENDPOINTS.forEach(function (path) {
      chain = chain.then(function (found) {
        if (found) return found;
        return fetch(path, {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
        })
          .then(function (res) {
            if (!res.ok) return null;
            var type = res.headers.get('content-type') || '';
            if (type.indexOf('json') === -1) return null; // an HTML login page
            return res.json();
          })
          .then(function (body) {
            var hit = pluckEmail(body);
            if (hit) hit.via = 'fetch ' + path;
            return hit;
          })
          .catch(function () {
            return null;
          });
      });
    });

    return chain;
  }

  function resolveIdentity() {
    if (cached) return Promise.resolve(cached);

    var sync = fromGlobals() || fromMeta() || fromDataAttributes();
    if (sync) {
      cached = sync;
      console.log('[st-kris] identity via ' + sync.via);
      return Promise.resolve(sync);
    }

    return fromEndpoints().then(function (found) {
      if (found) {
        cached = found;
        console.log('[st-kris] identity via ' + found.via);
      } else {
        console.warn(
          '[st-kris] could not determine the signed-in member. Kris AI will fall ' +
            'back to the server gate. Send this line to your developer.'
        );
      }
      return found;
    });
  }

  /* ---- answer the widget ------------------------------------------------- */

  window.addEventListener('message', function (event) {
    if (event.origin !== WIDGET_ORIGIN) return;

    var data = event.data;
    if (!data || data.type !== 'kris-ai:ready') return;

    var frame = event.source;

    var signedIn = isSignedIn();

    resolveIdentity().then(function (identity) {
      try {
        frame.postMessage(
          {
            type: 'st-kris:identity',
            /* The widget will not open without this. */
            signedIn: signedIn,
            email: (signedIn && identity && identity.email) || '',
            uscreenId: (signedIn && identity && identity.uscreenId) || '',
          },
          WIDGET_ORIGIN
        );
      } catch (e) {
        /* frame went away */
      }
    });
  });

  /* Warm the lookup so the answer is ready the moment the widget asks. */
  if (location.pathname.replace(/\/+$/, '') === '/delphi') {
    resolveIdentity();
  }
})();
</script>
