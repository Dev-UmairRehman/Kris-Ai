<!-- 2 ---------------------------------------------------------------------
     Page marker and link marker. This is the only block that knows the slugs.

     Sets on <html>:
       .st-kris          on either Kris page  (drives the sub-nav hider)
       .st-delphi        on /delphi only      (kept in case anything else uses it)
       .st-kris-memory   on the new page only

     Adds to every nav link pointing at a Kris page:
       .st-kris-link     always
       .is-current       when it points at the page you are on

     Marking the links with a class means block 3's CSS never has to repeat a
     slug, so changing PAGES.memory below is the only edit ever needed.

     It runs in <head>, so the <html> class is set before the sub-nav is parsed
     and there is no flash. Links get marked once the DOM exists, and again on
     every Turbo navigation - Uscreen is a Hotwire app and swaps pages without
     a full reload.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  /* ---- the only place a slug is written -------------------------------- */
  var PAGES = {
    delphi: '/delphi',            // existing "Kris AI" page (Delphi)
    memory: '/pages/kris-ai-memory',  // new "Kris AI Memory" page (BuddyPro)
  };

  /* Extra paths that mean the same page. /kris-ai is the 301 alias Uscreen
     support added on Sep 4 2026, and it is also what the address bar reads
     once block 6 has run - so it must resolve to 'delphi' or the tab
     highlight and the sub-nav hider would switch off on their own page.
     Keys are lower-case; the redirect is case-insensitive. */
  var ALIASES = {
    '/kris-ai': 'delphi',
  };

  /* Shared with blocks 4, 5, 6 and 8 so nothing is declared twice. */
  window.ST_KRIS = {
    pages: PAGES,
    aliases: ALIASES,
    vanity: '/kris-ai',           // what block 6 shows in the address bar
    widgetOrigin: 'https://kris-ai-memory-baefm.ondigitalocean.app',
    path: function () {
      return location.pathname.replace(/\/+$/, '') || '/';
    },
    /* Which Kris page a URL points at, or '' for anything else. Compares the
       pathname, so it works whether the nav stores a relative href or an
       absolute one - the existing nav item stores the absolute URL. */
    pageOf: function (url) {
      var p;
      try {
        p = new URL(url, location.href).pathname.replace(/\/+$/, '') || '/';
      } catch (e) {
        return '';
      }
      if (p === PAGES.delphi) return 'delphi';
      if (p === PAGES.memory) return 'memory';
      if (ALIASES[p.toLowerCase()]) return ALIASES[p.toLowerCase()];
      return '';
    },
  };

  function markPage() {
    try {
      var which = window.ST_KRIS.pageOf(location.href);
      var root = document.documentElement;
      root.classList.toggle('st-kris', which !== '');
      root.classList.toggle('st-delphi', which === 'delphi');
      root.classList.toggle('st-kris-memory', which === 'memory');
    } catch (e) {}
  }

  function markLinks() {
    try {
      var here = window.ST_KRIS.pageOf(location.href);
      var links = document.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        var which = window.ST_KRIS.pageOf(links[i].getAttribute('href'));
        if (!which) continue;
        links[i].classList.add('st-kris-link');
        links[i].classList.toggle('is-current', which === here);
      }
    } catch (e) {}
  }

  function run() {
    markPage();
    markLinks();
  }

  markPage();  /* before the sub-nav is parsed - no flash */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
  document.addEventListener('turbo:load', run);
  document.addEventListener('turbo:render', run);
})();
</script>

</style>

<!-- 4 ---------------------------------------------------------------------
     Kris link routing. Applies to BOTH Kris pages.

       logged out               -> /join   (intercepted at click, instant)
       logged in, no sub        -> /join   (Uscreen bounces them, we catch it)
       logged in, subscriber    -> the page (untouched)

     HOW IT KNOWS: it asks Uscreen once per page - GET /account, same-origin, so
     the session cookie rides along, and with NO Accept header. Measured on this
     store: 401 signed out, 200 signed in. Asking for JSON instead returns 406
     when signed in, because that route only renders HTML - so 406 counts as
     signed in too, since reaching it means the auth check passed.

     It does NOT read the DOM for a sign-in link. That test is unreliable here:
     the store keeps an <a href="/sign_in"> in a menu even when someone is
     signed in, and the visible Sign in control is a <ds-button>, not an <a>. A
     false "signed out" would send a paying member to /join, which is worse than
     doing nothing.

     So this FAILS OPEN: until the probe has answered, and if it never answers,
     clicks are left alone. That is safe because routing is only a convenience -
     the widget on the Kris AI Memory page gates access on its own, and Uscreen
     gates /delphi on its own.

     For a logged-in non-subscriber there is no client signal at all, so we set a
     short-lived flag on click: if they end up anywhere other than a Kris page
     within 12s, Uscreen rejected them and we send them to /join rather than
     dumping them on the homepage.

     A link to /kris-ai counts as a Kris link too - block 2's ALIASES makes
     pageOf() resolve it - so the nav item can point at either path.

     Note for /kris-ai-memory: it is a landing page, so it is PUBLIC and Uscreen
     will not bounce anyone from it. The click interception above is what keeps
     logged-out visitors out, and the widget itself refuses to open without a
     signed-in claim from block 5. A logged-in visitor without a subscription
     will reach the widget and be able to use it - that is what you asked for
     ("logged in or subscribed"). Telling a free account from a paying one needs
     MEMBER_GATE_MODE=strict and the Uscreen Publisher API key.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  var KEY = 'st_kai_click';
  var WINDOW_MS = 12000;

  /* null until Uscreen answers, then true/false. null means "do not touch". */
  var signedIn = null;

  function probeAccount() {
    try {
      /* No Accept header on purpose - see HOW IT KNOWS above. */
      fetch('/account', { credentials: 'same-origin' })
        .then(function (res) {
          var path = '';
          try {
            path = new URL(res.url, location.href).pathname;
          } catch (e) {}

          if (/\/(sign_in|login|join)\b/.test(path)) signedIn = false;
          else if (res.status === 401 || res.status === 403) signedIn = false;
          else if (res.ok || res.status === 406) signedIn = true;
        })
        .catch(function () {
          /* leave it null - clicks stay untouched */
        });
    } catch (e) {}
  }

  function knownSignedOut() {
    return signedIn === false;
  }

  document.addEventListener('click', function (e) {
    try {
      var a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      /* Ask block 2 whether this link is a Kris link - one source of truth. */
      if (!window.ST_KRIS || !window.ST_KRIS.pageOf(a.getAttribute('href'))) return;

      /* Only when Uscreen has actually said so. Unknown = leave it alone. */
      if (knownSignedOut()) {     // no point sending them to a page that rejects them
        e.preventDefault();
        location.href = '/join';
        return;
      }
      sessionStorage.setItem(KEY, String(Date.now()));   // backstop for non-subscribers
    } catch (err) {}
  }, true);

  function check() {
    try {
      var t = sessionStorage.getItem(KEY);
      if (!t) return;
      /* Landed on either Kris page = they got in. */
      if (window.ST_KRIS && window.ST_KRIS.pageOf(location.href)) {
        sessionStorage.removeItem(KEY);
        return;
      }

      sessionStorage.removeItem(KEY);
      var path = window.ST_KRIS ? window.ST_KRIS.path() : location.pathname;
      if (Date.now() - parseInt(t, 10) < WINDOW_MS && path !== '/join') {
        location.replace('/join');
      }
    } catch (err) {}
  }

  probeAccount();
  check();
  document.addEventListener('turbo:load', function () {
    /* A Turbo navigation can be a sign-in or a sign-out, so ask again. */
    signedIn = null;
    probeAccount();
    check();
  });
})();
</script>

<!-- 6 ---------------------------------------------------------------------
     Address-bar rewrite: show /kris-ai while sitting on /delphi.

     The Delphi integration serves the Kris AI page at /delphi and that path
     cannot be renamed - confirmed by both Delphi and Uscreen support. Uscreen
     support added a 301 /kris-ai -> /delphi instead, so /kris-ai is a real,
     shareable URL, but the browser still lands on /delphi and displays it.
     This rewrites the DISPLAYED url only: no reload, no navigation, no effect
     on the page, on Delphi SSO, or on Uscreen's member gate.

     SAFE BECAUSE /kris-ai resolves server-side, so refresh, back/forward and
     copy-paste of the visible URL all work. Both are single-segment root paths,
     so relative link resolution is identical either way. Block 2's ALIASES
     makes every other block treat the rewritten path as the same page.

     DEPENDS ON that 301 staying in place. If the redirect is ever removed,
     delete this block - otherwise a refresh would 404.

     To undo: delete this sixth block only. Nothing else references it.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  function rewrite() {
    try {
      if (!window.ST_KRIS || !window.history || !history.replaceState) return;
      var from = window.ST_KRIS.pages.delphi;          // '/delphi'
      var to   = window.ST_KRIS.vanity;                // '/kris-ai'
      if (window.ST_KRIS.path().toLowerCase() !== from) return;
      history.replaceState(history.state, '', to + location.search + location.hash);
    } catch (e) { /* never break the page */ }
  }

  rewrite();
  document.addEventListener('turbo:load', rewrite);
  document.addEventListener('turbo:render', rewrite);
})();
</script>

<!-- 7 ---------------------------------------------------------------------
     Hide Delphi's user-profile avatar on the Kris AI page (added Sep 23 2026,
     target narrowed Oct 5 2026).

     Delphi renders its own account menu top-right of the chat, showing its
     default placeholder image (clone-default.png) instead of the member's
     photo - the gray circle. Members manage their account through Uscreen's
     own avatar in the header, so Delphi's copy is redundant and looks broken.

     TARGET: the account button itself, .delphi-auth-menu-trigger. It used to
     target <div data-delphi-part="header-actions">, but Delphi now puts the
     Call button in that same container, so hiding it would hide Call too.

     NOTE (Oct 5 2026): Delphi's UI turned out to live in a cross-origin iframe
     (embed.delphi.ai), which this script cannot reach. The live fix is the
     same rule in Delphi Studio's own custom CSS for the embed. This block is
     kept as a harmless second net.

     WHY IT IS A SCRIPT, NOT JUST CSS: in case Delphi draws its UI inside a
     shadow root, which CSS in <head> cannot reach. So the same rule is put
     INSIDE every shadow root too:
       - it wraps attachShadow (runs in <head>, before Delphi loads), so each
         new shadow root gets the rule the moment it is created
       - it also scans shadow roots / same-origin iframes that already exist
       - and it hides the element directly as a last resort
     Every step is wrapped in try/catch - it can never break the page.

     To undo: delete this seventh block only. Nothing else references it.
     ---------------------------------------------------------------------- -->
<style id="st-hide-delphi-avatar">
  .delphi-auth-menu-trigger,
  .delphi-auth-menu-avatar,
  .delphi-auth-menu-avatar-image {
    display: none !important;
  }
</style>
<script>
(function () {
  var ID = 'st-hide-delphi-avatar';
  var CSS =
    '.delphi-auth-menu-trigger,.delphi-auth-menu-avatar,.delphi-auth-menu-avatar-image{display:none !important;}';

  function inject(root) {
    try {
      if (!root || root === document || root.querySelector('#' + ID)) return;
      var s = document.createElement('style');
      s.id = ID;
      s.textContent = CSS;
      (root.head || root).appendChild(s);
    } catch (e) {}
  }

  /* 1. Every shadow root created from now on gets the rule immediately. */
  try {
    var orig = Element.prototype.attachShadow;
    if (orig && !orig.__stWrapped) {
      var wrapped = function () {
        var root = orig.apply(this, arguments);
        inject(root);
        return root;
      };
      wrapped.__stWrapped = true;
      Element.prototype.attachShadow = wrapped;
    }
  } catch (e) {}

  /* 2. Existing shadow roots / same-origin iframes, plus a direct hide. */
  function hide(el) {
    try {
      el.style.setProperty('display', 'none', 'important');
    } catch (e) {}
  }

  function scan(root, depth) {
    try {
      if (!root || depth > 6) return;
      inject(root);
      var parts = root.querySelectorAll('.delphi-auth-menu-trigger');
      for (var j = 0; j < parts.length; j++) hide(parts[j]);
      var els = root.querySelectorAll('*');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.shadowRoot) scan(el.shadowRoot, depth + 1);
        if (el.tagName === 'IFRAME') {
          try { if (el.contentDocument) scan(el.contentDocument, depth + 1); } catch (e) {}
        }
      }
    } catch (e) {}
  }

  var timer = null;
  function schedule() {
    if (timer) return;
    timer = setTimeout(function () {
      timer = null;
      scan(document, 0);
    }, 250);
  }

  function start() {
    scan(document, 0);
    try {
      new MutationObserver(schedule).observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
  document.addEventListener('turbo:load', schedule);
  document.addEventListener('turbo:render', schedule);
})();
</script>

<!-- 8 ---------------------------------------------------------------------
     Open the Kris AI (Delphi) embed on CHAT instead of the profile
     (added Oct 5 2026).

     Delphi's "Default View = Chat" setting is ignored here because the embed
     address Uscreen builds carries its own landingPage value, and Delphi lets
     the address win (console: panel_source 'url_query'). This finds the Delphi
     embed frame - on the page or inside Uscreen's blank wrapper frame - and
     sets landingPage=CHAT. If it is already CHAT it does nothing, so it never
     loops. Sign-in is unaffected: Uscreen keeps re-sending the SSO token.

     Website only - the mobile app does not run Head Code.

     To undo: delete this eighth block only. Nothing else references it.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  var VIEW = 'CHAT';

  function fixFrame(f) {
    try {
      var src = f.getAttribute('src');
      if (!src) return;
      var u = new URL(src, location.href);
      if (!/(^|\.)delphi\.ai$/.test(u.hostname) || u.pathname.indexOf('/embed/') !== 0) return;
      if (u.searchParams.get('landingPage') === VIEW) return;
      u.searchParams.set('landingPage', VIEW);
      f.setAttribute('src', u.toString());
    } catch (e) {}
  }

  function scan(doc, depth) {
    try {
      if (!doc || depth > 3) return;
      var s = doc.querySelectorAll('script[data-channel]');
      for (var i = 0; i < s.length; i++) s[i].setAttribute('data-landing-page', VIEW);
      var frames = doc.querySelectorAll('iframe');
      for (var j = 0; j < frames.length; j++) {
        fixFrame(frames[j]);
        try { scan(frames[j].contentDocument, depth + 1); } catch (e) {}
      }
    } catch (e) {}
  }

  var timer = null;
  function start() {
    if (timer) { clearInterval(timer); timer = null; }
    if (!window.ST_KRIS || window.ST_KRIS.pageOf(location.href) !== 'delphi') return;
    var ticks = 0;
    scan(document, 0);
    timer = setInterval(function () {
      scan(document, 0);
      if (++ticks > 60) { clearInterval(timer); timer = null; }
    }, 250);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
  document.addEventListener('turbo:load', start);
})();
</script>
