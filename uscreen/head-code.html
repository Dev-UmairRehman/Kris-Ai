<!-- 2 ---------------------------------------------------------------------
     Page marker and link marker. This is the only block that knows the slugs.

     Sets on <html>:
       .st-kris          on either Kris page  (drives the sub-nav hider)
       .st-delphi        on /delphi only      (kept in case anything else uses it)
       .st-kris-memory   on the new page only

     Adds to every nav link pointing at a Kris page:
       .st-kris-link     always
       .is-current       when it points at the page you are on

     Marking the links with a class means block 3's CSS never has to repeat a
     slug, so changing PAGES.memory below is the only edit ever needed.

     It runs in <head>, so the <html> class is set before the sub-nav is parsed
     and there is no flash. Links get marked once the DOM exists, and again on
     every Turbo navigation - Uscreen is a Hotwire app and swaps pages without
     a full reload.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  /* ---- the only place a slug is written -------------------------------- */
  var PAGES = {
    delphi: '/delphi',            // existing "Kris AI" page (Delphi)
    memory: '/kris-ai-memory',    // new "Kris AI Memory" page (BuddyPro)
  };

  /* Shared with blocks 4 and 5 so nothing is declared twice. */
  window.ST_KRIS = {
    pages: PAGES,
    widgetOrigin: 'https://kris-ai-memory-baefm.ondigitalocean.app',
    path: function () {
      return location.pathname.replace(/\/+$/, '') || '/';
    },
    /* Which Kris page a URL points at, or '' for anything else. Compares the
       pathname, so it works whether the nav stores a relative href or an
       absolute one - the existing nav item stores the absolute URL. */
    pageOf: function (url) {
      var p;
      try {
        p = new URL(url, location.href).pathname.replace(/\/+$/, '') || '/';
      } catch (e) {
        return '';
      }
      if (p === PAGES.delphi) return 'delphi';
      if (p === PAGES.memory) return 'memory';
      return '';
    },
  };

  function markPage() {
    try {
      var which = window.ST_KRIS.pageOf(location.href);
      var root = document.documentElement;
      root.classList.toggle('st-kris', which !== '');
      root.classList.toggle('st-delphi', which === 'delphi');
      root.classList.toggle('st-kris-memory', which === 'memory');
    } catch (e) {}
  }

  function markLinks() {
    try {
      var here = window.ST_KRIS.pageOf(location.href);
      var links = document.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        var which = window.ST_KRIS.pageOf(links[i].getAttribute('href'));
        if (!which) continue;
        links[i].classList.add('st-kris-link');
        links[i].classList.toggle('is-current', which === here);
      }
    } catch (e) {}
  }

  function run() {
    markPage();
    markLinks();
  }

  markPage();  /* before the sub-nav is parsed - no flash */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
  document.addEventListener('turbo:load', run);
  document.addEventListener('turbo:render', run);
})();
</script>

<!-- 3 ---------------------------------------------------------------------
     Sub-nav hider and nav tab highlight. CSS only - no slugs in here.

     SUB-NAV: hides the catalog bar (Browse / Favorites / Playlists / Watch
     history) on both Kris pages. The bar is the div immediately after
     </header>:
       <div class="w-full border-b border-ds-default bg-ds-main overflow-x-auto z-[20]">

     HIGHLIGHT: the nav item is stored as an absolute URL, so Uscreen's own
     active-state logic never matches it against the current path and the tab
     never lights up. This applies the active look manually, using the
     .is-current class block 2 adds. Works for the top nav and the burger menu.

     An inset box-shadow is used instead of border-bottom so nothing shifts.
     ---------------------------------------------------------------------- -->
<style>
  html.st-kris div.w-full.border-b.bg-ds-main.overflow-x-auto {
    display: none !important;
  }

  a.st-kris-link.is-current {
    color: var(--primary, #2bc0e3) !important;
    box-shadow: inset 0 -3px 0 0 var(--primary, #2bc0e3) !important;
    text-decoration: none !important;
  }
</style>

<!-- 4 ---------------------------------------------------------------------
     Kris link routing. Applies to BOTH Kris pages.

       logged out               -> /join   (intercepted at click, instant)
       logged in, no sub        -> /join   (Uscreen bounces them, we catch it)
       logged in, subscriber    -> the page (untouched)

     Uscreen renders a /sign_in link only for logged-out visitors, so that is
     the logged-out test. For a logged-in non-subscriber there is no client
     signal, so we set a short-lived flag on click: if they end up anywhere
     other than a Kris page within 12s, Uscreen rejected them and we send them
     to /join rather than dumping them on the homepage.

     Note for /kris-ai-memory: it is a landing page, so it is PUBLIC and Uscreen
     will not bounce anyone from it. The click interception above is what keeps
     logged-out visitors out, and the widget itself refuses to open without a
     signed-in claim from block 5. A logged-in visitor without a subscription
     will reach the widget and be able to use it - that is what you asked for
     ("logged in or subscribed"). Telling a free account from a paying one needs
     MEMBER_GATE_MODE=strict and the Uscreen Publisher API key.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  var KEY = 'st_kai_click';
  var WINDOW_MS = 12000;

  function loggedOut() {
    return !!document.querySelector('a[href="/sign_in"], a[href$="/sign_in"]');
  }

  document.addEventListener('click', function (e) {
    try {
      var a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      /* Ask block 2 whether this link is a Kris link - one source of truth. */
      if (!window.ST_KRIS || !window.ST_KRIS.pageOf(a.getAttribute('href'))) return;

      if (loggedOut()) {          // no point sending them to a page that rejects them
        e.preventDefault();
        location.href = '/join';
        return;
      }
      sessionStorage.setItem(KEY, String(Date.now()));   // backstop for non-subscribers
    } catch (err) {}
  }, true);

  function check() {
    try {
      var t = sessionStorage.getItem(KEY);
      if (!t) return;
      /* Landed on either Kris page = they got in. */
      if (window.ST_KRIS && window.ST_KRIS.pageOf(location.href)) {
        sessionStorage.removeItem(KEY);
        return;
      }

      sessionStorage.removeItem(KEY);
      var path = window.ST_KRIS ? window.ST_KRIS.path() : location.pathname;
      if (Date.now() - parseInt(t, 10) < WINDOW_MS && path !== '/join') {
        location.replace('/join');
      }
    } catch (err) {}
  }

  check();
  document.addEventListener('turbo:load', check);
})();
</script>

<!-- 5 ---------------------------------------------------------------------
     Kris AI Memory identity bridge.  THIS BLOCK IS NOT OPTIONAL.

     Kris AI Memory (BuddyPro) runs on its own domain inside an iframe, so it
     cannot read the Uscreen session cookie. This tells it whether anyone is
     signed in, using the store's own signal - Uscreen renders a /sign_in link
     only when logged out. The widget forwards that to its own server, which
     will not open a session without it.

     Without this block every visitor sees the "please sign in" screen, member
     or not. That is the safe way round: /kris-ai-memory is a landing page and
     therefore public, so being framed by strategytraining.com proves nothing.

     HOW STRONG IS THIS
     Strong enough to stop every ordinary visitor. Not cryptographic: the claim
     is made in the browser, so someone already on strategytraining.com with the
     dev console open could assert it by hand. The widget's CSP frame-ancestors
     rule stops it loading anywhere but strategytraining.com, and per-session and
     global rate limits cap what any one of them could spend. For real
     verification set MEMBER_GATE_MODE=strict on the app and supply the Uscreen
     Publisher API key (UscreenPlus or Custom plan).

     PROTOCOL
       widget -> parent :  { type: 'kris-ai:ready' }
       parent -> widget :  { type: 'st-kris:identity', signedIn, email, uscreenId }

     signedIn grants access. email/uscreenId only decide which memory thread the
     member gets, and are blank when signedIn is false. Both sides post to an
     explicit origin, never '*'.

     This block does not touch /delphi and has no effect on the Delphi page.

     IF THE EMAIL CANNOT BE FOUND
     Access still works (login state is enough); only per-member memory is
     affected, since members would share a per-browser thread. Open the console
     on the Kris AI Memory page and look for the [st-kris] line - it names the
     source that worked, or reports that none did. Send that line to your
     developer and the lookup gets pinned to it.
     ---------------------------------------------------------------------- -->
<script>
(function () {
  'use strict';

  /* The origin the widget is served from. */
  var WIDGET_ORIGIN = 'https://kris-ai-memory-baefm.ondigitalocean.app';

  var cached = null;

  /* Is anyone signed in? Uscreen renders a link to /sign_in in the header ONLY
     for logged-out visitors, which is the same signal the public Kris AI
     gateway page already uses on this store. Absence of that link means signed
     in.

     This matters because a Uscreen landing page is PUBLIC. The widget refuses
     to open unless this says someone is signed in, so putting it on a public
     page does not hand it to the world. */
  function isSignedIn() {
    var signInLink = document.querySelector(
      'a[href="/sign_in"], a[href$="/sign_in"], a[href*="/sign_in?"]'
    );
    if (signInLink) return false;

    /* Corroboration, where the storefront offers it. */
    var signedOutHints = document.querySelector('a[href="/login"], a[href$="/login"]');
    if (signedOutHints) return false;

    return true;
  }

  /* ---- find the signed-in member ---------------------------------------- */

  /* Synchronous sources first - these cost nothing. */
  function fromGlobals() {
    var roots = [window.Uscreen, window.uscreen, window.USCREEN, window.currentUser];
    for (var i = 0; i < roots.length; i++) {
      var root = roots[i];
      if (!root || typeof root !== 'object') continue;
      var user = root.user || root.currentUser || root.customer || root;
      if (user && typeof user.email === 'string' && user.email.indexOf('@') > 0) {
        return { email: user.email, uscreenId: user.id || '', via: 'window global' };
      }
    }
    return null;
  }

  function fromMeta() {
    var names = [
      'current-user-email',
      'current_user_email',
      'user-email',
      'customer-email',
    ];
    for (var i = 0; i < names.length; i++) {
      var tag = document.querySelector('meta[name="' + names[i] + '"]');
      var value = tag && tag.getAttribute('content');
      if (value && value.indexOf('@') > 0) {
        return { email: value, uscreenId: '', via: 'meta[' + names[i] + ']' };
      }
    }
    return null;
  }

  function fromDataAttributes() {
    var nodes = document.querySelectorAll('[data-user-email], [data-customer-email], [data-email]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var value =
        el.getAttribute('data-user-email') ||
        el.getAttribute('data-customer-email') ||
        el.getAttribute('data-email');
      if (value && value.indexOf('@') > 0) {
        return {
          email: value,
          uscreenId: el.getAttribute('data-user-id') || '',
          via: 'data attribute',
        };
      }
    }
    return null;
  }

  /* Then same-origin authenticated endpoints. These carry the Uscreen session
     cookie automatically, so they only ever return the current member. */
  var ENDPOINTS = [
    '/api/v1/users/me',
    '/api/v1/customers/me',
    '/api/v1/me',
    '/users/me.json',
    '/account.json',
    '/api/customer',
  ];

  function pluckEmail(payload) {
    if (!payload || typeof payload !== 'object') return null;
    var candidates = [payload, payload.user, payload.customer, payload.data, payload.me];
    for (var i = 0; i < candidates.length; i++) {
      var c = candidates[i];
      if (c && typeof c.email === 'string' && c.email.indexOf('@') > 0) {
        return { email: c.email, uscreenId: c.id || c.uuid || '' };
      }
    }
    return null;
  }

  function fromEndpoints() {
    var chain = Promise.resolve(null);

    ENDPOINTS.forEach(function (path) {
      chain = chain.then(function (found) {
        if (found) return found;
        return fetch(path, {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
        })
          .then(function (res) {
            if (!res.ok) return null;
            var type = res.headers.get('content-type') || '';
            if (type.indexOf('json') === -1) return null; // an HTML login page
            return res.json();
          })
          .then(function (body) {
            var hit = pluckEmail(body);
            if (hit) hit.via = 'fetch ' + path;
            return hit;
          })
          .catch(function () {
            return null;
          });
      });
    });

    return chain;
  }

  function resolveIdentity() {
    if (cached) return Promise.resolve(cached);

    var sync = fromGlobals() || fromMeta() || fromDataAttributes();
    if (sync) {
      cached = sync;
      console.log('[st-kris] identity via ' + sync.via);
      return Promise.resolve(sync);
    }

    return fromEndpoints().then(function (found) {
      if (found) {
        cached = found;
        console.log('[st-kris] identity via ' + found.via);
      } else {
        console.warn(
          '[st-kris] could not determine the signed-in member. Kris AI will fall ' +
            'back to the server gate. Send this line to your developer.'
        );
      }
      return found;
    });
  }

  /* ---- answer the widget ------------------------------------------------- */

  window.addEventListener('message', function (event) {
    if (event.origin !== WIDGET_ORIGIN) return;

    var data = event.data;
    if (!data || data.type !== 'kris-ai:ready') return;

    var frame = event.source;

    var signedIn = isSignedIn();

    resolveIdentity().then(function (identity) {
      try {
        frame.postMessage(
          {
            type: 'st-kris:identity',
            /* The widget will not open without this. */
            signedIn: signedIn,
            email: (signedIn && identity && identity.email) || '',
            uscreenId: (signedIn && identity && identity.uscreenId) || '',
          },
          WIDGET_ORIGIN
        );
      } catch (e) {
        /* frame went away */
      }
    });
  });

  /* Warm the lookup so the answer is ready the moment the widget asks. Keyed on
     the widget being present rather than on a page slug, so renaming or moving
     the Kris AI Memory page does not quietly disable this. */
  if (document.querySelector('iframe[src*="' + WIDGET_ORIGIN + '"]')) {
    resolveIdentity();
  }
})();
</script>
